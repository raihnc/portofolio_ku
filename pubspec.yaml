name: portofolio_ku
description: "Ini merupakan project portofolio saya yg berbasis web menggunakan tech flutter & dart."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10
  get: ^4.6.6
  flutter_animate: ^4.2.0+1
  google_fonts: ^6.1.0
  web: ^1.1.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
  - assets/images/
  - assets/certificates/
